intro: "I study AI & Robotics, but most of what I know comes from building
  things. Curiosity about how games work turned into a habit of shipping:
  shooters, physics puzzles, a space simulator, browser games, and now
  localSpace, a local agent workspace written in Rust. Here I write about what
  I'm learning and keep a daily photo log."
