<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b10; --card:rgba(255,255,255,.04); --accent:#d6b98c; --accent-2:#e8d4b0;
    --text:#f5f5f5; --muted:#90999a8; --border:rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.7; padding:4rem 1.5rem; margin:0; }
  .container { max-width: 720px; margin: 0 auto; }
  a { color:var(--accent); text-decoration:none; transition:.3s; }
  a:hover { color:var(--accent-2); }
  .back-link { display:inline-flex; align-items:center; gap:.5rem; font-size:.8rem; font-weight:500; margin-bottom:2.5rem; padding:.5rem 1rem; border:1px solid var(--border); border-radius:999px; color:var(--muted); }
  .back-link:hover { border-color:var(--accent); color:var(--accent); }
  .date { color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; margin-bottom:1rem; }
  h1 { font-family:'Playfair Display',serif; font-size:2.6rem; line-height:1.2; margin-bottom:1.5rem; letter-spacing:-0.02em; }
  h2, h3 { font-family:'Playfair Display',serif; color:var(--text); margin-top:2.5rem; margin-bottom:1rem; }
  p { margin-bottom:1.5rem; color:var(--muted); font-size:1.1rem; }
  p strong { color:var(--text); font-weight:600; }
  img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); margin: 2.5rem 0; display: block; }
  pre { background: #050608; border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; overflow-x: auto; margin: 2.5rem 0; }
  code { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.6; color: #d4d4d4; }
  p code { background: rgba(255,255,255,.05); padding: .2rem .4rem; border-radius: 4px; font-size: 0.9em; color: var(--accent); }
</style>
</head>
<body>
  <div class="container">
    <a href="{{ site.baseurl }}/" class="back-link">← Back to Portfolio</a>
    <div class="date">{{ page.date | date: "%B %d, %Y" }}</div>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </div>
</body>
</html>
