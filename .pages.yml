media:
  input: assets
  output: assets

content:
  - name: posts
    label: Daily Blog Posts
    path: _posts
    type: collection
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: layout
        type: string
        default: post
        hidden: true
      - name: body
        label: Content
        type: rich-text
